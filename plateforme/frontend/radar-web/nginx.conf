# Point d'entrée unique : sert l'application Angular (SPA) et relaie /api vers radar-api.
# /internal (ingestion des signaux) n'est jamais relayé. En production, la terminaison TLS se fait
# devant ce conteneur (Caddy ou Traefik avec certificat Let's Encrypt).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    location /api/ {
        proxy_pass http://radar-api:8080;
        proxy_set_header Host $host;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Fichiers à empreinte (main-XXXX.js) : cache long ; index.html : jamais en cache
    location ~* \.(js|css|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
