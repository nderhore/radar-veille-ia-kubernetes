# Chart cnpg/cloudnative-pg : opérateur PostgreSQL (bascule automatique, sauvegardes, pooler).
monitoring:
  podMonitorEnabled: true         # métriques de l'opérateur lui-même
  grafanaDashboard:
    create: true                  # tableau de bord CloudNativePG officiel
    labels:
      grafana_dashboard: "1"
resources:
  requests:
    cpu: 50m
    memory: 128Mi
