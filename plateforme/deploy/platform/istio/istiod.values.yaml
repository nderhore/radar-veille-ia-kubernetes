# Chart istio/istiod : plan de contrôle du maillage (mode sidecar).
# Même fichier pour kind (helm) et pour la production (Argo CD) : une seule source de vérité.

# Plugin CNI : la redirection du trafic est faite par le DaemonSet istio-cni et non par un
# conteneur init privilégié (NET_ADMIN). Prérequis pour viser le profil Pod Security « restricted ».
cni:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi

global:
  proxy:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi

meshConfig:
  # Journaux d'accès Envoy en JSON sur la sortie standard : collectés par Vector, envoyés à Loki
  accessLogFile: /dev/stdout
  accessLogEncoding: JSON
  # Sortie Internet contrôlée : seuls les hôtes déclarés par ServiceEntry sont joignables (egress)
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY
  defaultConfig:
    # L'application ne démarre qu'une fois le proxy prêt (connexion à la base au démarrage)
    holdApplicationUntilProxyStarts: true
  enablePrometheusMerge: true
  extensionProviders:
    - name: otel-tracing
      opentelemetry:
        service: tempo.observability.svc.cluster.local
        port: 4317
