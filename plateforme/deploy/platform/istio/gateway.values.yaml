# Chart istio/gateway : passerelle d'entrée (release « istio-ingressgateway » : label istio=ingressgateway).
# kind : NodePort 30080 relayé sur localhost:8080. Production : type LoadBalancer et TLS (overlay prod).
service:
  type: NodePort
  ports:
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 80
      nodePort: 30080
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
      nodePort: 30443

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

autoscaling:
  enabled: false
