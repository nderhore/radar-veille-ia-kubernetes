# Chart grafana/tempo : traces distribuées reçues en OTLP depuis les proxys Envoy (Istio).
tempo:
  retention: 72h
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
persistence:
  enabled: false
