# Chart vector/vector : agent de collecte des journaux (DaemonSet, un pod par nœud).
# Chaîne : journaux des conteneurs, analyse (JSON ECS Spring Boot, accès Envoy), masquage RGPD
#         , filtrage du bruit, Loki (journaux) + Prometheus (métriques dérivées des journaux).
role: Agent

containerPorts:
  - name: prom-exporter
    containerPort: 9598
    protocol: TCP
  - name: api
    containerPort: 8686
    protocol: TCP

service:
  enabled: true
  ports:
    - name: prom-exporter
      port: 9598
      protocol: TCP

podMonitor:
  enabled: true                     # Prometheus collecte les métriques produites par Vector

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

# Les gabarits Vector {{ champ }} sont échappés car le chart passe customConfig dans le moteur de templates de Helm.
customConfig:
  data_dir: /vector-data-dir
  api:
    enabled: true
    address: 0.0.0.0:8686
  sources:
    k8s_logs:
      type: kubernetes_logs
      # Périmètre : l'application et la passerelle (journaux d'accès Envoy)
      extra_namespace_label_selector: "kubernetes.io/metadata.name in (radar,istio-system)"
    vector_metrics:
      type: internal_metrics
  transforms:
    parse:
      type: remap
      inputs: [k8s_logs]
      source: |
        .namespace = .kubernetes.pod_namespace
        .container = .kubernetes.container_name
        .app = .kubernetes.pod_labels."app.kubernetes.io/name"
        if .app == null { .app = .kubernetes.container_name }
        .level = "info"
        .msg = string(.message) ?? ""

        parsed, err = parse_json(.message)
        if err == null && is_object(parsed) {
          # Journal applicatif Spring Boot (Elastic Common Schema)
          if exists(parsed.log.level) {
            .level = downcase(string(parsed.log.level) ?? "info")
            .logger = parsed.log.logger
            .msg = string(parsed.message) ?? .msg
            .trace_id = parsed.traceId
          }
          # Journal d'accès Envoy (proxy Istio)
          if exists(parsed.response_code) {
            .http = parsed
            code = to_int(parsed.response_code) ?? 0
            .level = if code >= 500 { "error" } else if code >= 400 { "warn" } else { "info" }
            .msg = join!([string(parsed.method) ?? "-", string(parsed.path) ?? "-", to_string(code)], " ")
          }
        }

        # RGPD : masquage des adresses électroniques avant stockage
        .msg = replace(.msg, r'[\w.+-]+@[\w-]+\.[\w.-]+', "<email>")
        del(.message)
        del(.kubernetes.pod_annotations)
        del(.kubernetes.node_labels)
    drop_noise:
      type: filter
      inputs: [parse]
      # Les sondes de santé représentent l'essentiel du volume et aucune information
      condition: |
        msg = to_string(.msg) ?? ""
        !contains(msg, "/actuator/health") && !contains(msg, "/healthz")
    log_metrics:
      type: log_to_metric
      inputs: [drop_noise]
      metrics:
        - type: counter
          field: level
          name: log_events_total
          namespace: radar
          tags:                             # « source_namespace » : « namespace » est réservé par Prometheus
            app: '{{ "{{ app }}" }}'
            level: '{{ "{{ level }}" }}'
            source_namespace: '{{ "{{ namespace }}" }}'
  sinks:
    loki:
      type: loki
      inputs: [drop_noise]
      endpoint: http://loki.observability.svc.cluster.local:3100
      encoding:
        codec: json
      # Cardinalité maîtrisée : 3 labels à faible nombre de valeurs (jamais l'identifiant de pod ou de trace)
      labels:
        namespace: '{{ "{{ namespace }}" }}'
        app: '{{ "{{ app }}" }}'
        level: '{{ "{{ level }}" }}'
    prometheus:
      type: prometheus_exporter
      inputs: [log_metrics, vector_metrics]
      address: 0.0.0.0:9598
