# --- Entrée : la passerelle publie le front et l'API publique, jamais l'API interne ---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: radar-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts: ["*"]                                  # production : nom de domaine et HTTPS (overlay prod)
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: radar-edge
spec:
  hosts: ["*"]
  gateways: [radar-gateway]
  http:
    - name: internal-blocked                        # l'API interne n'est jamais exposée
      match:
        - uri:
            prefix: /internal
      directResponse:
        status: 404
    - name: api
      match:
        - uri:
            prefix: /api/
      route:
        - destination:
            host: radar-api
            subset: v1
            port:
              number: 8080
          weight: 100
      timeout: 5s
      retries:
        attempts: 2
        perTryTimeout: 2s
        retryOn: connect-failure,refused-stream,unavailable,503
    - name: web
      route:
        - destination:
            host: radar-web
            port:
              number: 8080
---
# --- Trafic interne (du collecteur vers l'API) : même politique de sous-ensembles, retries pour les écritures idempotentes ---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: radar-api-mesh
spec:
  hosts: [radar-api]
  http:
    - name: api-internal
      route:
        - destination:
            host: radar-api
            subset: v1
            port:
              number: 8080
          weight: 100
      timeout: 30s
      retries:
        attempts: 3                                 # l'ingestion est idempotente (empreinte source + URL)
        perTryTimeout: 10s
        retryOn: 5xx,connect-failure,reset
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: radar-api
spec:
  host: radar-api
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 200
        maxRequestsPerConnection: 100
    # Disjoncteur : une instance qui renvoie des 5xx en série est écartée temporairement
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
