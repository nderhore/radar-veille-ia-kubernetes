# Cluster PostgreSQL haute disponibilité géré par CloudNativePG (décision D4).
#  - 3 instances : 1 primaire + 2 réplicas en réplication en flux (streaming), bascule automatique
#  - services créés par l'opérateur : radar-db-rw (primaire), radar-db-ro (réplicas), radar-db-r (toutes)
#  - secret radar-db-app : identifiants applicatifs (username, password, uri…), générés et renouvelables
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: radar-db
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised               # mise à jour : réplicas d'abord, puis bascule contrôlée

  # Les pods PostgreSQL restent hors du maillage : l'opérateur doit les joindre directement
  # (API d'état sur le port 8000) et PostgreSQL chiffre déjà ses connexions (TLS natif).
  inheritedMetadata:
    annotations:
      sidecar.istio.io/inject: "false"

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 128MB
      log_min_duration_statement: "500ms"           # requêtes lentes visibles dans Loki
      log_checkpoints: "on"
    # Réplication synchrone vers au moins un réplica : aucune transaction validée perdue en cas de bascule (RPO ≈ 0)
    synchronous:
      method: any
      number: 1

  bootstrap:
    initdb:
      database: radar
      owner: radar

  storage:
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred                  # « required » en production (1 instance par nœud ou par zone)
---
# PgBouncer devant le primaire (décision D5) : mutualise les connexions des réplicas de radar-api.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: radar-db-pooler-rw
spec:
  cluster:
    name: radar-db
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "500"
      default_pool_size: "20"
      max_prepared_statements: "200"                # requêtes préparées JDBC compatibles avec le mode transaction
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers: []
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: radar-db
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: radar-db
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: radar-db-pooler
spec:
  selector:
    matchLabels:
      cnpg.io/poolerName: radar-db-pooler-rw
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
