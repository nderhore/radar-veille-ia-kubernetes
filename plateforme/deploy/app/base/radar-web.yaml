apiVersion: v1
kind: ServiceAccount
metadata:
  name: radar-web
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radar-web
  labels:
    app.kubernetes.io/name: radar-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: radar-web
  template:
    metadata:
      labels:
        app: radar-web
        version: v1
        app.kubernetes.io/name: radar-web
        app.kubernetes.io/part-of: radar
    spec:
      serviceAccountName: radar-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 101                              # utilisateur nginx de l'image non privilégiée
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: radar-web
          image: radar/radar-web:1.0.0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: radar-web
  labels:
    app.kubernetes.io/name: radar-web
spec:
  selector:
    app.kubernetes.io/name: radar-web
  ports:
    - name: http-web
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: radar-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: radar-web
