apiVersion: v1
kind: ServiceAccount
metadata:
  name: signal-collector                            # seule identité autorisée à appeler /internal/signals
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-collector
  labels:
    app.kubernetes.io/name: signal-collector
    app.kubernetes.io/component: collector
spec:
  replicas: 1                                       # planificateur unique : évite les collectes en double
  strategy:
    type: Recreate                                  # jamais deux collecteurs simultanés pendant un déploiement
  selector:
    matchLabels:
      app.kubernetes.io/name: signal-collector
  template:
    metadata:
      labels:
        app: signal-collector
        version: v1
        app.kubernetes.io/name: signal-collector
        app.kubernetes.io/part-of: radar
    spec:
      serviceAccountName: signal-collector
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: signal-collector
          image: radar/signal-collector:1.0.0
          ports:
            - name: management
              containerPort: 8081
          env:
            - name: RADAR_API_URL
              value: http://radar-api.radar.svc.cluster.local:8080
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: radar-collector-secrets
                  key: github-token
                  optional: true                    # sans jeton : quota GitHub réduit, collecte plus lente
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: signal-collector
  labels:
    app.kubernetes.io/name: signal-collector
spec:
  selector:
    app.kubernetes.io/name: signal-collector
  ports:
    - name: http-management
      port: 8081
      targetPort: management
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: signal-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: signal-collector
  endpoints:
    - port: http-management
      path: /actuator/prometheus
      interval: 30s
