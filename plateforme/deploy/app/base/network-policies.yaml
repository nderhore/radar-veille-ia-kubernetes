# Défense en profondeur : les AuthorizationPolicy Istio filtrent au niveau 7 (identité, chemin, méthode),
# les NetworkPolicy filtrent au niveau 3/4 et protègent aussi ce qui est hors maillage (PostgreSQL).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-frontends
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [radar-web, radar-api]}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-collector-to-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: radar-api
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: signal-collector
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-pooler
spec:
  podSelector:
    matchLabels:
      cnpg.io/poolerName: radar-db-pooler-rw
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: radar-api
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-cluster
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: radar-db
  ingress:
    # De PgBouncer vers PostgreSQL
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/poolerName: radar-db-pooler-rw
      ports:
        - port: 5432
    # Réplication entre instances et API d'état interne
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: radar-db
      ports:
        - port: 5432
        - port: 8000
    # Opérateur CloudNativePG
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 5432
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 8081                                # Spring Boot Actuator
        - port: 15020                               # métriques fusionnées Istio (agent + application)
        - port: 15090                               # métriques Envoy
        - port: 9187                                # exporteur PostgreSQL (CloudNativePG)
        - port: 9127                                # exporteur PgBouncer
