apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: radar
resources:
  - prometheus-rules.yaml
# Tableau de bord Grafana versionné, chargé automatiquement par le sidecar (label grafana_dashboard=1)
configMapGenerator:
  - name: radar-dashboards
    files:
      - dashboards/radar-plateforme.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
