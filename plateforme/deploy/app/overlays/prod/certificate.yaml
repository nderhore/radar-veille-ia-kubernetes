# Certificat TLS de la passerelle, émis et renouvelé automatiquement par cert-manager (Let's Encrypt).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: radar-tls
  namespace: istio-system
spec:
  secretName: radar-tls
  dnsNames:
    - radar.example.org
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
