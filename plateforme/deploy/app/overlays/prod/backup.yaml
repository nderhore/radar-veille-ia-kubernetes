# Sauvegardes PostgreSQL (décision D4) : archivage continu des WAL + sauvegarde de base quotidienne.
# Objectifs : RPO ≤ 5 min (WAL archivés en continu), RTO ≤ 30 min (restauration à un instant donné, PITR).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: radar-backups
  namespace: radar
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://radar-backups-example/radar-db
    s3Credentials:
      accessKeyId:
        name: radar-backup-s3                       # secret fourni par External Secrets (décision D12)
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: radar-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: radar-db-daily
  namespace: radar
spec:
  schedule: "0 0 2 * * *"                           # 02:00 chaque nuit (format cron à 6 champs)
  backupOwnerReference: self
  cluster:
    name: radar-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
