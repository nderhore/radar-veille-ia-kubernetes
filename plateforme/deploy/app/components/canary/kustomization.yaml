# Livraison progressive (décision D10) : la v2 reçoit 10 % du trafic, de l'extérieur comme de l'intérieur du maillage.
# Promotion : passer les poids à 50/50 puis 0/100, puis remplacer l'image de v1. Retour arrière : 100/0.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - radar-api-v2.yaml
patches:
  - target:
      kind: VirtualService
      name: radar-edge
    patch: |-
      - op: replace
        path: /spec/http/1/route
        value:
          - destination: {host: radar-api, subset: v1, port: {number: 8080}}
            weight: 90
          - destination: {host: radar-api, subset: v2, port: {number: 8080}}
            weight: 10
  - target:
      kind: VirtualService
      name: radar-api-mesh
    patch: |-
      - op: replace
        path: /spec/http/0/route
        value:
          - destination: {host: radar-api, subset: v1, port: {number: 8080}}
            weight: 90
          - destination: {host: radar-api, subset: v2, port: {number: 8080}}
            weight: 10
