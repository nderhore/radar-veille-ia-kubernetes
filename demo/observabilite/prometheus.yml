# Prometheus (décision D5) : collecte des métriques de l'API, du collecteur et de Vector.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/regles-alertes.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: radar-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["radar-api:8081"]
  - job_name: signal-collector
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["signal-collector:8081"]
  - job_name: vector                     # métriques dérivées des journaux
    static_configs:
      - targets: ["vector:9598"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
