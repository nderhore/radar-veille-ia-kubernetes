# Le radar industrialisé sous Docker Compose : la même architecture qu'en production, sur un poste.
#
#   make up              application seule (≈ 1,5 Go d'images), sur http://localhost:8088
#   make up-complet      application et observabilité (≈ 2,5 Go d'images), Grafana sur http://localhost:3000
#
# Décisions de l'étude de cas visibles dans ce fichier :
#   D1  deux services Java (radar-api, signal-collector) et un front Angular (radar-web) ;
#   D2  Docker Compose, redémarrage automatique des conteneurs, images versionnées (RADAR_VERSION) ;
#   D3  point d'entrée unique (radar-web) et réseaux cloisonnés : la base n'est joignable que par l'API,
#       le collecteur ne voit que l'API ;
#   D4  PostgreSQL sur volume persistant, sauvegarde et restauration (make sauvegarde, make restauration) ;
#   D5  Prometheus, Alertmanager, Grafana, Vector et Loki (profil « observabilite ») ;
#   D6  routage des alertes vers trois destinataires (observabilite/alertmanager.yml).
#
# Ports publiés : en production, seul le point d'entrée est publié, en HTTPS. Les autres ports
# ne le sont ici que pour la démonstration.
name: radar-cours

services:
  # ------------------------------------------------------------------ application
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar            # démonstration uniquement ; en production, fichier .env non versionné
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [donnees]

  radar-api:
    build: ../plateforme/services/radar-api
    image: radar/radar-api:${RADAR_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/radar
      DB_USERNAME: radar
      DB_PASSWORD: radar
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"                       # démonstration : métriques et sondes (/actuator/prometheus)
    networks: [exposition, collecte, donnees]

  signal-collector:
    build: ../plateforme/services/signal-collector
    image: radar/signal-collector:${RADAR_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      RADAR_API_URL: http://radar-api:8080
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      - radar-api
    ports:
      - "8082:8081"                       # démonstration : métriques du collecteur
    networks: [collecte]

  radar-web:
    build: ../plateforme/frontend/radar-web
    image: radar/radar-web:${RADAR_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      - radar-api
    ports:
      - "8088:8080"                       # point d'entrée : front Angular et relais /api
    networks: [exposition]

  # ------------------------------------------------------------------ observabilité (profil « observabilite »)
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observabilite]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./observabilite/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilite/regles-alertes.yml:/etc/prometheus/regles-alertes.yml:ro
    ports:
      - "9090:9090"
    networks: [collecte, supervision]     # collecte : accès aux métriques de l'API et du collecteur

  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: [observabilite]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./observabilite/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks: [supervision]

  loki:
    image: grafana/loki:3.7.8
    profiles: [observabilite]
    command: -config.file=/etc/loki/local-config.yaml   # configuration mono-instance fournie par l'image
    ports:
      - "3100:3100"
    networks: [supervision]

  vector:
    image: timberio/vector:0.59.0-alpine
    profiles: [observabilite]
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./observabilite/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # lecture des journaux des conteneurs
    depends_on:
      - loki
    networks: [supervision]

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [observabilite]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: radar-demo
      GF_AUTH_ANONYMOUS_ENABLED: "true"           # consultation sans connexion pendant la démonstration
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/radar-demo.json
    volumes:
      - ./observabilite/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilite/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    ports:
      - "3000:3000"
    networks: [supervision]

networks:
  exposition: {}            # point d'entrée et API
  collecte: {}              # collecteur, API et Prometheus : le collecteur ne voit que l'API
  donnees:
    internal: true          # base de données : aucun accès à Internet, seule l'API la joint
  supervision: {}           # chaîne d'observabilité

volumes:
  pgdata: {}
