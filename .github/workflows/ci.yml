# Intégration continue : tests, validation de la configuration Docker Compose, images, analyse de
# vulnérabilités et signature.
#
# Tests et validations à chaque push et pull request. La construction des images se déclenche à la
# main (Actions, puis Run workflow) : elle publie sur ghcr.io.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write          # publication sur ghcr.io
  id-token: write          # signature sans clé (cosign + OIDC)

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: mvn -B verify
        working-directory: plateforme/services
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: plateforme/frontend/radar-web/package-lock.json}
      - run: npm ci && npx ng build
        working-directory: plateforme/frontend/radar-web

  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - name: Configuration Docker Compose
        run: docker compose --profile observabilite config -q
      - name: Règles et configuration Prometheus (promtool)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/observabilite:/cfg:ro" prom/prometheus:v3.15.0 \
            check rules /cfg/regles-alertes.yml
      - name: Routage des alertes (amtool)
        run: |
          docker run --rm --entrypoint amtool -v "$PWD/observabilite:/cfg:ro" prom/alertmanager:v0.34.1 \
            check-config /cfg/alertmanager.yml
      - name: Configuration Vector
        run: |
          docker run --rm -v "$PWD/observabilite:/cfg:ro" timberio/vector:0.59.0-alpine \
            validate --no-environment /cfg/vector.yaml

  images:
    needs: [test, validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - {name: radar-api, path: plateforme/services/radar-api}
          - {name: signal-collector, path: plateforme/services/signal-collector}
          - {name: radar-web, path: plateforme/frontend/radar-web}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.component.name }}:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Analyse de vulnérabilités (bloquante sur CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.component.name }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: sigstore/cosign-installer@v3
      - name: Signature de l'image
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ matrix.component.name }}@${{ steps.build.outputs.digest }}
